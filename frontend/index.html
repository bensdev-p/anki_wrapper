<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rounds" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Rounds</title>
    <script>
      // The app was called Lacuna: carry its saved settings over once.
      try {
        var old = []
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i)
          if (k && k.indexOf('lacuna.') === 0) old.push(k)
        }
        old.forEach(function (k) {
          var nk = 'rounds.' + k.slice(7)
          if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(k))
          localStorage.removeItem(k)
        })
      } catch (e) {}
      // Apply the last-used theme before first paint so there's no flash.
      try {
        var css = JSON.parse(localStorage.getItem('rounds.theme-css') || 'null')
        if (css) {
          var s = document.createElement('style')
          s.id = 'theme-vars'
          s.textContent = css
          document.head.appendChild(s)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
